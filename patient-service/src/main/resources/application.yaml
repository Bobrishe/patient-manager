spring:
  application:
    name: patient-service

  h2:
    console:
      path: /h2-console

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb
    username: admin-viewer
    password: password

  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: update

server:
  port: 4000